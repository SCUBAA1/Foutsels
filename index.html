function distance(a,b){return Math.hypot(a.obj.position.x-b.obj.position.x,a.obj.position.z-b.obj.position.z)}function nearest(){return bots.filter(p=>p.alive).sort((a,b)=>distance(hero,a)-distance(hero,b))[0]}function knock(p,from,power){if(!p||!p.alive)return;let v=p.obj.position.clone().sub(from.obj.position);v.y=0;v.normalize();p.velocity.addScaledVector(v,power)}function eliminate(p,why){if(!p.alive)return;p.alive=false;p.obj.visible=false;report.push(names[p.idx]+' '+why);if(p===hero){alive=false;finish(false,'Je bent uitgeschakeld!')}else{points+=25;toast(names[p.idx]+' is uitgeschakeld!')}}function finish(win,reason){if(phase!=='play')return;phase='done';points+=win?100:0;message(reason);$('notice').textContent=win?'🏆 MISSIE GESLAAGD':'💀 MISSIE MISLUKT';setTimeout(()=>{$('notice').textContent='';showMenu(true)},1200)}function action(n){if(phase!=='play'||!alive)return;let now=clock,p=nearest(),range=p?distance(hero,p):999;const ready=(key,delay)=>{if((cool[key]||0)>now){toast('Wacht '+Math.ceil(cool[key]-now)+' sec.');return false}cool[key]=now+delay;return true};if(n===3){if(!ready('dash',9)||stamina<20)return;stamina-=20;let d=new T.Vector3(Math.sin(hero.obj.rotation.y),0,Math.cos(hero.obj.rotation.y));hero.velocity.addScaledVector(d,8);toast('DASH!');return}if(n===4&&cfg.mode==='HEIST'){if(!ready('blackout',30))return;blackout=true;lightning=clock+9;toast('⚡ BLACKOUT — 9 SECONDEN!');return}if(n===4){if(!ready('block',12))return;protectedUntil=now+2.5;toast('BLOCK ACTIEF');return}if(cfg.mode==='CIRCLE'){if(!p||range>2.8){toast('Kom dichter bij iemand!');return}if(n===1&&ready('push',16)){knock(p,hero,11);toast('DUW!')}if(n===2&&ready('pull',20)){knock(p,{obj:{position:p.obj.position.clone().multiplyScalar(2).sub(hero.obj.position)}},8);toast('TREK!')}return}if(n===2&&['HUNT','HEIST','WITNESS'].includes(cfg.mode)){vote();return}if(!ready('search',2))return;if(cfg.mode==='HUNT'||cfg.mode==='WITNESS'){let near=objects.find(o=>!o.used&&o.obj.position.distanceTo(hero.obj.position)<3);if(!near){toast('Zoek een onderzoekbaar object.');return}near.used=true;near.obj.material=M.glow;clues++;points+=15;toast('BEWIJS '+clues+'/3 gevonden!');if(clues>=3){if(cfg.mode==='WITNESS')finish(true,'Je hebt alle drie bewijzen gevonden!');else message('Drie bewijzen! Gebruik STEM om de Hunter te vinden.')}return}if(cfg.mode==='CHEST'){let near=objects.find(o=>!o.used&&o.obj.position.distanceTo(hero.obj.position)<3);if(!near){toast('Loop naar een schatkist!');return}near.used=true;near.obj.visible=false;if(near.index===4){finish(true,'Je vond de echte schat!')}else{points=Math.max(0,points-10);toast('Vervloekte kist! −10 punten')}}else if(cfg.mode==='HEIST'){if(goal&&goal.position.distanceTo(hero.obj.position)<3){clues++;points+=20;toast('KLUIS ONDERZOCHT!');if(blackout)finish(true,'Je hebt de diefstal onderzocht!');else message('Je vond de kluis. Activeer BLACKOUT.')}else toast('Zoek de gouden kluis!')}else if(cfg.mode==='KING'||cfg.mode==='GETAWAY'){if(goal&&goal.position.distanceTo(hero.obj.position)<3){finish(true,cfg.mode==='KING'?'Je hebt de kroon veroverd!':'Je hebt de buit veiliggesteld!')}else toast('Volg het gouden doel!')}else toast('Blijf op het platform!')}
function vote(){if(phase!=='play')return;phase='vote';$('overlay').style.display='flex';$('panel').innerHTML='<h1>WIE IS HET?</h1><p>Kies de geheime Hunter/dief. Je hebt '+clues+' bewijsstukken.</p><div class="row" id="voters"></div><button class="primary" id="back">TERUG</button>';[hero,...bots].forEach((p,i)=>{if(!p.alive)return;let b=document.createElement('button');b.className='choice';b.textContent=names[p.idx];b.onclick=()=>{let right=i===secret;$('overlay').style.display='none';phase='play';finish(right,right?'Goed geraden! De geheime speler was '+names[[hero,...bots][secret].idx]:'Fout! De geheime speler was '+names[[hero,...bots][secret].idx])};$('voters').appendChild(b)});$('back').onclick=()=>{$('overlay').style.display='none';phase='play'}}
$('act1').onclick=()=>action(1);$('act2').onclick=()=>action(2);$('act3').onclick=()=>action(3);$('act4').onclick=()=>action(4);$('menuBtn').onclick=()=>showMenu();let pad=$('pad'),nub=$('nub'),pressed=false;function padMove(e){let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,len=Math.hypot(x,y),s=Math.min(len,40)/(len||1);joystick.x=x*s/40;joystick.y=y*s/40;nub.style.transform=`translate(${joystick.x*34}px,${joystick.y*34}px)`}pad.addEventListener('pointerdown',e=>{pressed=true;pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(pressed)padMove(e)});function padEnd(){pressed=false;joystick.x=joystick.y=0;nub.style.transform=''}pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===' ')action(1)});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.4)dragCam={id:e.pointerId,x:e.clientX};});renderer.domElement.addEventListener('pointermove',e=>{if(dragCam&&e.pointerId===dragCam.id){camAngle+=(e.clientX-dragCam.x)*.004;dragCam.x=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>dragCam=null);
function update(dt){if(phase!=='play'||!hero)return;clock+=dt;remaining-=dt;if(remaining<=0){finish(cfg.mode==='HUNT'||cfg.mode==='CIRCLE',cfg.mode==='CIRCLE'?'Je hebt de tijd overleefd!':'Tijd voorbij!');return}let mx=joystick.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=joystick.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(mx,my);if(len>.1){let x=(mx*Math.cos(camAngle)-my*Math.sin(camAngle))/Math.max(1,len),z=(my*Math.cos(camAngle)+mx*Math.sin(camAngle))/Math.max(1,len);hero.obj.position.x+=x*dt*5.2;hero.obj.position.z+=z*dt*5.2;hero.obj.rotation.y=Math.atan2(x,z);hero.obj.position.y=Math.sin(clock*12)*.035}hero.obj.position.addScaledVector(hero.velocity,dt);hero.velocity.multiplyScalar(Math.exp(-5*dt));stamina=Math.min(100,stamina+dt*9);if(cfg.mode==='CIRCLE'){ring=Math.max(2.8,14-clock*.082);for(let a of world.children){if(a.geometry?.type==='CylinderGeometry')a.scale.set(ring/14,1,ring/14)}if(Math.hypot(hero.obj.position.x,hero.obj.position.z)>ring)eliminate(hero,'viel van de rand')}else{hero.obj.position.x=T.MathUtils.clamp(hero.obj.position.x,-24,24);hero.obj.position.z=T.MathUtils.clamp(hero.obj.position.z,-24,24)}
for(let i=0;i<bots.length;i++){let p=bots[i];if(!p.alive)continue;p.ai+=dt;let pos=p.obj.position,dir=new T.Vector3();if(cfg.mode==='CIRCLE'){let target=hero.obj.position;let toward=target.clone().sub(pos);toward.y=0;let safe=pos.length()>ring*.72;dir=safe?pos.clone().multiplyScalar(-1):toward;dir.y=0;if(distance(p,hero)<2.2&&Math.sin(clock*1.7+i)>0.95&&clock>protectedUntil){knock(hero,p,6.5);toast(names[p.idx]+' duwde je!')}}else{dir.set(Math.sin(p.ai*.7+i),0,Math.cos(p.ai*.53+i))}dir.normalize();pos.addScaledVector(dir,dt*(cfg.mode==='CIRCLE'?2.15:1.2));pos.addScaledVector(p.velocity,dt);p.velocity.multiplyScalar(Math.exp(-5*dt));p.obj.rotation.y=Math.atan2(dir.x,dir.z);if(cfg.mode==='CIRCLE'&&Math.hypot(pos.x,pos.z)>ring)eliminate(p,'viel van het platform');if(cfg.mode==='HUNT'&&secret===i+1&&distance(p,hero)<2&&clock>18&&Math.sin(clock*1.4+i)>.985&&clock>protectedUntil){eliminate(hero,'werd door de Hunter uitgeschakeld')}}if(cfg.mode==='CIRCLE'&&bots.every(b=>!b.alive))finish(true,'Jij bent de laatste overlevende!');if(cfg.mode==='BLOCKS'){objects.forEach(o=>{if(clock>8+o.index*2.8&&!o.used){o.used=true;o.obj.visible=false}});let under=objects.some(o=>o.obj.visible&&Math.abs(hero.obj.position.x-o.obj.position.x)<2.2&&Math.abs(hero.obj.position.z-o.obj.position.z)<2.2);if(clock>10&&!under&&Math.hypot(hero.obj.position.x,hero.obj.position.z)>3)eliminate(hero,'viel door de vloer');if(clock>95)finish(true,'Je overleefde de vallende blokken!')}if(blackout&&clock>lightning){blackout=false;toast('LICHTEN WEER AAN')}scene.background.set(blackout?0x030408:cfg.map==='REALM'?0x182d25:0x101827);hemi.intensity=blackout?.28:2.2;sun.intensity=blackout?.15:2.6;$('time').textContent=Math.ceil(remaining)+' SEC';$('points').textContent=points;$('bar').style.width=stamina+'%';$('topInfo').textContent=cfg.mode==='CIRCLE'?'CIRKEL '+ring.toFixed(1)+'m · '+(bots.filter(b=>b.alive).length+1)+' OVER':modes.find(m=>m[0]===cfg.mode)[1];}
function animate(t){requestAnimationFrame(animate);let dt=Math.min(.05,(t-last)/1000||.016);last=t;update(dt);if(hero){let p=hero.obj.position,target=new T.Vector3(p.x+Math.sin(camAngle)*10,7.4,p.z+Math.cos(camAngle)*10);camera.position.lerp(target,Math.min(1,dt*5));camera.lookAt(p.x,1.4,p.z)}else{camera.position.set(13,11,17);camera.lookAt(0,0,0)}renderer.render(scene,camera)}window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});mapBuild();showMenu();requestAnimationFrame(animate);
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
